[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diligence-copilot"
version = "0.1.0"
description = "RAG-powered due diligence copilot: ingestion, retrieval and cited generation over filings, financials, decks and market reports."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
retrieval = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "numpy>=1.26",
    "sentence-transformers>=2.7",
]
gemini = ["google-genai>=1.30"]
anthropic = ["anthropic>=2.14"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "reportlab>=4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: needs a running Postgres at DATABASE_URL"]
